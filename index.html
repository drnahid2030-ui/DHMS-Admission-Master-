<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DHMS এডমিশন মাস্টার</title>
<meta name="theme-color" content="#0F4C3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-deep:#F1EADA;
    --ink:#211D16;
    --ink-muted:#6E6656;
    --green:#0F4C3A;
    --green-deep:#0A362A;
    --maroon:#8E2A2A;
    --gold:#B8862E;
    --gold-bg:#FBF0D6;
    --blue:#1F5A7A;
    --blue-bg:#E7F0F5;
    --line:#DDD2B8;
    --correct:#1D7A4C;
    --correct-bg:#E4F3E9;
    --wrong:#A02D2D;
    --wrong-bg:#FBE8E6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Hind Siliguri',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif Bengali',serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Masthead (home) ---------- */
  .masthead{
    background:var(--green);
    color:var(--paper);
    padding:22px 20px 18px;
    border-bottom:3px solid var(--gold);
  }
  .masthead .eyebrow{
    font-size:12.5px;
    letter-spacing:.03em;
    color:#CFE3D9;
    margin-bottom:4px;
  }
  .masthead h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    line-height:1.25;
  }
  .masthead .sub{
    margin-top:6px;
    font-size:13.5px;
    color:#CFE3D9;
  }

  /* ---------- Simple top bar (non-home screens) ---------- */
  .topbar{
    background:var(--green-deep);color:var(--paper);
    padding:14px 18px 12px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .topbar .home-tap{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:14px;color:#CFE3D9;
  }
  .topbar .home-tap .ico{font-size:17px;line-height:1;}
  .topbar .timer{
    font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:16px;
    color:var(--gold);background:rgba(255,255,255,.08);
    padding:4px 12px;border-radius:20px;
  }
  .topbar .timer.low{color:#fff;background:var(--wrong);}
  .topbar .score{font-weight:600;color:#F1D28A;font-size:13px;}
  .progress-track{
    height:5px;background:rgba(255,255,255,.18);
    border-radius:3px;margin-top:10px;overflow:hidden;
  }
  .progress-fill{height:100%;background:var(--gold);width:0%;transition:width .25s ease;}

  /* ---------- Content shell ---------- */
  .content{padding:18px 18px 90px;flex:1;}
  .section-label{
    font-size:14px;
    color:var(--ink-muted);
    margin:22px 2px 10px;
  }
  .section-label:first-child{margin-top:4px;}

  /* ---------- Mode cards (home) ---------- */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mode-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 14px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .12s ease;
  }
  .mode-card:active{transform:scale(.97);}
  .mode-card .ico{font-size:26px;margin-bottom:8px;display:block;}
  .mode-card .title{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:15.5px;line-height:1.3;}
  .mode-card .desc{font-size:11.5px;color:var(--ink-muted);margin-top:4px;line-height:1.4;}
  .mode-card.wide{grid-column:1 / -1;display:flex;align-items:center;gap:14px;}
  .mode-card.wide .ico{margin-bottom:0;font-size:30px;}
  .mode-card.accent-green{border-top:3px solid var(--green);}
  .mode-card.accent-gold{border-top:3px solid var(--gold);}
  .mode-card.accent-maroon{border-top:3px solid var(--maroon);}
  .mode-card.accent-blue{border-top:3px solid var(--blue);}
  .mode-card.disabled{opacity:.45;pointer-events:none;}
  .mode-card .badge{
    position:absolute;top:10px;right:10px;
    font-size:11px;font-weight:700;color:var(--green);
    background:var(--paper-deep);border-radius:20px;padding:2px 9px;
  }

  .shelf{display:flex;flex-direction:column;gap:10px;}
  .spine{
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-left:7px solid var(--green);
    border-radius:6px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .spine:active{transform:scale(.985);}
  .spine.disabled{opacity:.45;pointer-events:none;}
  .spine .name{font-family:'Noto Serif Bengali',serif;font-size:17px;font-weight:600;}
  .spine .meta{font-size:12.5px;color:var(--ink-muted);margin-top:3px;}
  .spine .count{
    font-size:14px;font-weight:700;color:var(--green);
    background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:4px 12px;white-space:nowrap;
  }
  .spine.review{border-left-color:var(--maroon);}
  .spine.review .count{color:var(--maroon);}

  .stat-row{display:flex;gap:10px;margin-top:2px;}
  .stat-box{
    flex:1;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;text-align:center;
  }
  .stat-box .num{font-family:'Noto Serif Bengali',serif;font-size:20px;font-weight:700;color:var(--green);}
  .stat-box .lbl{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  /* ---------- Chips (picker screens) ---------- */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:#fff;border:1.5px solid var(--line);border-radius:20px;
    padding:9px 16px;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .chip.active{background:var(--green);border-color:var(--green);color:#fff;}

  /* ---------- Quiz screen ---------- */
  .qwrap{padding:22px 18px 110px;flex:1;}
  .qcount{font-size:12.5px;color:var(--ink-muted);margin-bottom:8px;}
  .qtext{
    font-family:'Noto Serif Bengali',serif;
    font-size:19px;line-height:1.55;font-weight:600;
    margin-bottom:20px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    background:#fff;border:1.5px solid var(--line);
    border-radius:9px;padding:12px 14px;
    cursor:pointer;font-size:15.5px;line-height:1.4;
    transition:background .12s, border-color .12s;
  }
  .opt .bullet{
    flex:0 0 30px;height:30px;border-radius:50%;
    border:1.5px solid var(--ink-muted);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:14px;
    color:var(--ink-muted);
  }
  .opt.correct{background:var(--correct-bg);border-color:var(--correct);}
  .opt.correct .bullet{background:var(--correct);border-color:var(--correct);color:#fff;}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);}
  .opt.wrong .bullet{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .opt.selected-plain{background:var(--blue-bg);border-color:var(--blue);}
  .opt.selected-plain .bullet{background:var(--blue);border-color:var(--blue);color:#fff;}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.55;}

  .next-bar{
    position:fixed;left:0;right:0;bottom:0;
    max-width:520px;margin:0 auto;
    background:var(--paper);border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:none;
  }
  .next-bar.show{display:flex;gap:10px;}
  .btn{
    display:block;width:100%;text-align:center;
    background:var(--green);color:#fff;border:none;
    font-family:'Hind Siliguri',sans-serif;font-size:16px;font-weight:600;
    padding:13px;border-radius:8px;cursor:pointer;
  }
  .btn:active{background:var(--green-deep);}
  .btn.secondary{background:#fff;color:var(--green);border:1.5px solid var(--green);}
  .btn.maroon{background:var(--maroon);}
  .btn.ghost{background:transparent;color:var(--ink-muted);border:1.5px solid var(--line);flex:0 0 auto;width:auto;padding:13px 16px;}

  /* ---------- Result screen ---------- */
  .result-hero{
    background:var(--green);color:var(--paper);
    padding:34px 20px 26px;text-align:center;
    border-bottom:3px solid var(--gold);
  }
  .result-hero .big{font-family:'Noto Serif Bengali',serif;font-size:44px;font-weight:700;}
  .result-hero .cap{font-size:14px;color:#CFE3D9;margin-top:4px;}
  .review-list{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .review-item{
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  }
  .review-item .rq{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:15.5px;margin-bottom:8px;}
  .review-item .ra{font-size:13.5px;margin:2px 0;}
  .review-item .ra.correct{color:var(--correct);font-weight:600;}
  .review-item .ra.wrong{color:var(--wrong);font-weight:600;text-decoration:line-through;}
  .empty-note{
    text-align:center;color:var(--ink-muted);font-size:14px;
    padding:24px 10px;
  }
  .btn-col{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

  /* ---------- Progress screen ---------- */
  .prog-item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;}
  .prog-item .prow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .prog-item .pname{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:15px;}
  .prog-item .ppct{font-size:13px;font-weight:700;color:var(--green);}
  .bar-track{height:8px;background:var(--paper-deep);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:var(--green);}
  .prog-item .psub{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}

  .footer-credit{
    text-align:center;font-size:11.5px;color:var(--ink-muted);
    padding:10px 18px 4px;
  }
  ::selection{background:#F1D28A;}

  /* ---------- Gate screen ---------- */
  .gate-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px;}
  .gate-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px;}
  .gate-card h2{margin:0 0 6px;font-size:21px;}
  .gate-card .gate-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:20px;line-height:1.5;}
  .field-label{font-size:13px;color:var(--ink-muted);margin:0 2px 6px;}
  .field-input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;
    font-family:'Hind Siliguri',sans-serif;font-size:15.5px;margin-bottom:16px;background:#fff;color:var(--ink);
  }
  .field-input:focus{outline:none;border-color:var(--green);}
  .field-error{color:var(--wrong);font-size:12.5px;margin:-10px 0 14px;display:none;}
  .field-error.show{display:block;}
</style>
</head>
<body>
<div id="app"></div>
<script src="questions.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- Firebase (usage tracking) ----------------
  var firebaseConfig = {
    apiKey: "AIzaSyAzZOSUuK_TgliOClY1qTh2xtg8ayFxRPM",
    authDomain: "dhms-admission-master.firebaseapp.com",
    projectId: "dhms-admission-master",
    storageBucket: "dhms-admission-master.firebasestorage.app",
    messagingSenderId: "794922118272",
    appId: "1:794922118272:web:2da02faf8f94286347ca65"
  };
  var db = null;
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }

  var USER_KEY = "dhms_user_v1";
  var currentUser = null;
  function loadUser(){
    try{
      var raw = localStorage.getItem(USER_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
  function saveUser(u){
    try{ localStorage.setItem(USER_KEY, JSON.stringify(u)); }catch(e){}
  }
  function sanitizeMobile(m){
    return String(m).replace(/[^0-9]/g,"");
  }

  var pendingSeconds = 0;
  var lastTick = Date.now();
  function heartbeatTick(){
    var now = Date.now();
    pendingSeconds += Math.round((now - lastTick)/1000);
    lastTick = now;
    flushUsage(false);
  }
  function flushUsage(isFinal){
    if(!db || !currentUser || pendingSeconds <= 0) return;
    var delta = pendingSeconds;
    pendingSeconds = 0;
    var ref = db.collection("users").doc(sanitizeMobile(currentUser.mobile));
    var payload = {
      name: currentUser.name,
      mobile: currentUser.mobile,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
      totalSeconds: firebase.firestore.FieldValue.increment(delta)
    };
    ref.set(payload, {merge:true})['catch'](function(){});
  }
  function registerUserCloud(u){
    if(!db) return;
    var ref = db.collection("users").doc(sanitizeMobile(u.mobile));
    ref.get().then(function(snap){
      var payload = {
        name: u.name,
        mobile: u.mobile,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        sessions: firebase.firestore.FieldValue.increment(1)
      };
      if(!snap.exists){
        payload.firstSeen = firebase.firestore.FieldValue.serverTimestamp();
        payload.totalSeconds = 0;
      }
      ref.set(payload, {merge:true})['catch'](function(){});
    })['catch'](function(){
      ref.set({
        name:u.name, mobile:u.mobile,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        sessions: firebase.firestore.FieldValue.increment(1)
      }, {merge:true})['catch'](function(){});
    });
  }
  function syncStatsCloud(store){
    if(!db || !currentUser) return;
    var ref = db.collection("users").doc(sanitizeMobile(currentUser.mobile));
    ref.set({
      totalAttempted: store.attempted,
      totalCorrect: store.correct
    }, {merge:true})['catch'](function(){});
  }

  setInterval(heartbeatTick, 20000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flushUsage(true);
    else lastTick = Date.now();
  });
  window.addEventListener("pagehide", function(){ flushUsage(true); });

  var SUBJECTS = [
    {key:"bangla",  name:"বাংলা",         meta:"সাহিত্য, ব্যাকরণ"},
    {key:"english", name:"English",       meta:"Grammar, Vocabulary"},
    {key:"gonit",   name:"গণিত",          meta:"পাটিগণিত, বীজগণিত"},
    {key:"biggan",  name:"বিজ্ঞান",        meta:"সাধারণ বিজ্ঞান"},
    {key:"gk",      name:"সাধারণ জ্ঞান",   meta:"বাংলাদেশ ও বিশ্ব"}
  ];
  var DURATIONS = [5, 10, 15, 20];

  var STORE_KEY = "dhms_admission_master_v2";
  var OLD_STORE_KEY = "dhms_admission_master_v1";
  var QUESTIONS = window.QUESTIONS || [];

  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
      var old = localStorage.getItem(OLD_STORE_KEY);
      if(old){
        var o = JSON.parse(old);
        return {best:o.best||{}, wrongIds:o.wrongIds||[], attempted:o.attempted||0, correct:o.correct||0, timedRuns:0};
      }
    }catch(e){}
    return {best:{}, wrongIds:[], attempted:0, correct:0, timedRuns:0};
  }
  function saveStore(s){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
    syncStatsCloud(s);
  }
  var store = loadStore();
  if(store.timedRuns === undefined) store.timedRuns = 0;

  function byId(id){ return document.getElementById(id); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function countFor(key){
    if(key==="__review__") return store.wrongIds.length;
    if(key==="__all__") return QUESTIONS.length;
    return QUESTIONS.filter(function(q){return q.subject===key;}).length;
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  var LETTERS = ["ক","খ","গ","ঘ"];
  var root = byId("app");
  var state = null;
  var timerInterval = null;

  function clearTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }

  // ---------------- Session builders ----------------
  function buildPool(subjectKey){
    if(subjectKey === "__review__"){
      var idSet = {};
      store.wrongIds.forEach(function(id){ idSet[id]=true; });
      return QUESTIONS.filter(function(q){ return idSet[q.id]; });
    }
    if(subjectKey === "__all__"){
      return QUESTIONS;
    }
    return QUESTIONS.filter(function(q){ return q.subject === subjectKey; });
  }

  function startSession(subjectKey, label, opts){
    opts = opts || {};
    var pool = shuffle(buildPool(subjectKey));
    if(opts.limit){ pool = pool.slice(0, opts.limit); }
    var items = pool.map(function(q){
      var order = shuffle([0,1,2,3]);
      return {q:q, order:order, answered:false, picked:null};
    });
    state = {
      mode: opts.timed ? "timed" : "practice",
      subjectKey: subjectKey,
      label: label,
      items: items,
      idx: 0,
      score: 0,
      startedAt: Date.now(),
      timeLimitSec: opts.timed ? opts.durationMin*60 : null,
      remainingSec: opts.timed ? opts.durationMin*60 : null
    };
    clearTimer();
    if(state.mode === "timed"){
      timerInterval = setInterval(tickTimer, 1000);
    }
    renderQuiz();
  }

  function tickTimer(){
    if(!state || state.mode !== "timed") return;
    state.remainingSec--;
    if(state.remainingSec <= 0){
      state.remainingSec = 0;
      clearTimer();
      finishSession();
      return;
    }
    var t = byId("timerDisplay");
    if(t){
      t.textContent = fmtTime(state.remainingSec);
      if(state.remainingSec <= 30) t.classList.add("low");
    }
  }

  function goHome(){
    clearTimer();
    renderHome();
  }

  // ---------------- Home ----------------
  function renderHome(){
    state = null;
    var html = "";
    html += '<div class="masthead">';
    html += '<div class="eyebrow">সিমিলিয়া প্রকাশনী · ভর্তি প্রস্তুতি সহায়িকা</div>';
    html += '<h1>DHMS এডমিশন মাস্টার</h1>';
    html += '<div class="sub">DHMS ভর্তি পরীক্ষার জন্য সম্পূর্ণ অনুশীলন প্ল্যাটফর্ম</div>';
    html += '</div>';
    html += '<div class="content">';

    html += '<div class="stat-row">';
    html += '<div class="stat-box"><div class="num">'+store.attempted+'</div><div class="lbl">মোট চেষ্টা</div></div>';
    var pct = store.attempted ? Math.round(100*store.correct/store.attempted) : 0;
    html += '<div class="stat-box"><div class="num">'+pct+'%</div><div class="lbl">সঠিক হার</div></div>';
    html += '<div class="stat-box"><div class="num">'+store.wrongIds.length+'</div><div class="lbl">ভুল প্রশ্ন জমা</div></div>';
    html += '</div>';

    html += '<div class="section-label">মোড বেছে নিন</div>';
    html += '<div class="mode-grid">';

    html += '<div class="mode-card accent-green" id="cardPractice"><span class="ico">📘</span><div class="title">MCQ প্র্যাকটিস</div><div class="desc">বিষয়ভিত্তিক অনুশীলন, তাৎক্ষণিক ফলাফল</div></div>';

    html += '<div class="mode-card accent-gold" id="cardTimed"><span class="ico">⏱️</span><div class="title">টাইম গেম সেশন</div><div class="desc">সময় বেঁধে আসল পরীক্ষার অনুভূতি</div></div>';

    html += '<div class="mode-card accent-maroon'+(store.wrongIds.length===0?' disabled':'')+'" id="cardReview"><span class="ico">🔁</span><div class="title">ভুল প্রশ্ন রিভিউ</div><div class="desc">আগে যা ভুল হয়েছে, আবার অনুশীলন</div><span class="badge">'+store.wrongIds.length+'</span></div>';

    html += '<div class="mode-card accent-blue" id="cardProgress"><span class="ico">📊</span><div class="title">আমার অগ্রগতি</div><div class="desc">বিষয়ভিত্তিক পারফরম্যান্স দেখুন</div></div>';

    html += '</div>';

    html += '<div class="section-label">বিষয় বেছে অনুশীলন করুন</div>';
    html += '<div class="shelf">';
    SUBJECTS.forEach(function(s){
      var n = countFor(s.key);
      var best = store.best[s.key];
      html += '<div class="spine'+(n===0?' disabled':'')+'" data-subject="'+s.key+'" data-label="'+s.name+'">';
      html += '<div><div class="name">'+s.name+'</div><div class="meta">'+s.meta+(best!==undefined?' · সেরা স্কোর '+best+'%':'')+'</div></div>';
      html += '<div class="count">'+n+' টি</div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="footer-credit">DHMS এডমিশন মাস্টার · সিমিলিয়া পাবলিকেশন্স থেকে ডিজিটাইজড</div>';
    html += '</div>';
    root.innerHTML = html;

    byId("cardPractice").addEventListener("click", function(){
      var shelf = root.querySelector(".shelf");
      if(shelf) shelf.scrollIntoView({behavior:"smooth", block:"start"});
    });
    byId("cardTimed").addEventListener("click", renderTimedPicker);
    if(store.wrongIds.length>0){
      byId("cardReview").addEventListener("click", function(){
        startSession("__review__", "ভুল প্রশ্ন পুনরালোচনা");
      });
    }
    byId("cardProgress").addEventListener("click", renderProgress);

    root.querySelectorAll(".spine:not(.disabled)").forEach(function(el){
      el.addEventListener("click", function(){
        startSession(el.getAttribute("data-subject"), el.getAttribute("data-label"));
      });
    });
  }

  // ---------------- Timed picker ----------------
  function renderTimedPicker(){
    var chosenSubject = "__all__";
    var chosenDuration = 10;

    var html = "";
    html += '<div class="topbar"><span class="home-tap" id="homeBtn"><span class="ico">⌂</span> হোম</span><span></span></div>';
    html += '<div class="content">';
    html += '<h2 style="margin:4px 0 2px;">টাইম গেম সেশন</h2>';
    html += '<div style="color:var(--ink-muted);font-size:13.5px;margin-bottom:10px;">নির্দিষ্ট সময়ের মধ্যে যত বেশি সম্ভব প্রশ্নের উত্তর দিন। সময় শেষ হলে সেশন স্বয়ংক্রিয়ভাবে শেষ হয়ে যাবে।</div>';

    html += '<div class="section-label">বিষয়</div>';
    html += '<div class="chip-row" id="subjectChips">';
    html += '<div class="chip active" data-key="__all__">সব বিষয় (মিশ্র)</div>';
    SUBJECTS.forEach(function(s){
      if(countFor(s.key)>0) html += '<div class="chip" data-key="'+s.key+'">'+s.name+'</div>';
    });
    html += '</div>';

    html += '<div class="section-label">সময়</div>';
    html += '<div class="chip-row" id="durationChips">';
    DURATIONS.forEach(function(d,i){
      html += '<div class="chip'+(i===1?' active':'')+'" data-min="'+d+'">'+d+' মিনিট</div>';
    });
    html += '</div>';

    html += '<div class="btn-col"><button class="btn" id="startTimedBtn">সেশন শুরু করুন</button></div>';
    html += '</div>';
    root.innerHTML = html;

    byId("homeBtn").addEventListener("click", goHome);
    root.querySelectorAll("#subjectChips .chip").forEach(function(el){
      el.addEventListener("click", function(){
        root.querySelectorAll("#subjectChips .chip").forEach(function(c){c.classList.remove("active");});
        el.classList.add("active");
        chosenSubject = el.getAttribute("data-key");
      });
    });
    root.querySelectorAll("#durationChips .chip").forEach(function(el){
      el.addEventListener("click", function(){
        root.querySelectorAll("#durationChips .chip").forEach(function(c){c.classList.remove("active");});
        el.classList.add("active");
        chosenDuration = parseInt(el.getAttribute("data-min"),10);
      });
    });
    byId("startTimedBtn").addEventListener("click", function(){
      store.timedRuns++;
      saveStore(store);
      var label = (chosenSubject==="__all__" ? "সব বিষয় (মিশ্র)" : (SUBJECTS.filter(function(s){return s.key===chosenSubject;})[0]||{}).name) + " · টাইম গেম";
      startSession(chosenSubject, label, {timed:true, durationMin:chosenDuration});
    });
  }

  // ---------------- Quiz ----------------
  function currentItem(){ return state.items[state.idx]; }

  function renderQuiz(){
    var item = currentItem();
    var q = item.q;
    var total = state.items.length;
    var pct = Math.round(100*state.idx/total);
    var timed = state.mode === "timed";

    var html = "";
    html += '<div class="topbar">';
    html += '<span class="home-tap" id="homeBtn"><span class="ico">⌂</span> হোম</span>';
    if(timed){
      html += '<span class="timer'+(state.remainingSec<=30?' low':'')+'" id="timerDisplay">'+fmtTime(state.remainingSec)+'</span>';
    } else {
      html += '<span class="score">স্কোর: '+state.score+'/'+state.idx+'</span>';
    }
    html += '</div>';
    html += '<div style="padding:0 18px;background:var(--green-deep);">';
    html += '<div class="progress-track" style="margin-top:0;margin-bottom:10px;"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    html += '</div>';

    html += '<div class="qwrap">';
    html += '<div class="qcount">'+state.label+' · প্রশ্ন '+(state.idx+1)+' / '+total+'</div>';
    html += '<div class="qtext">'+escapeHtml(q.q)+'</div>';
    html += '<div class="options">';
    item.order.forEach(function(origIdx, pos){
      var letter = LETTERS[pos];
      var text = q.options[origIdx];
      var cls = "opt";
      if(item.answered){
        cls += " locked";
        if(timed){
          if(item.picked === origIdx) cls += " selected-plain";
        } else {
          var isCorrectOpt = (origIdx === q.answerIndex);
          if(isCorrectOpt) cls += " correct";
          else if(item.picked === origIdx) cls += " wrong";
          else cls += " dim";
        }
      }
      html += '<div class="'+cls+'" data-orig="'+origIdx+'">';
      html += '<div class="bullet">'+letter+'</div><div>'+escapeHtml(text)+'</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';

    var showNextBar = timed ? true : item.answered;
    html += '<div class="next-bar'+(showNextBar?' show':'')+'" id="nextBar">';
    if(timed && !item.answered){
      html += '<button class="btn ghost" id="skipBtn">এড়িয়ে যান</button>';
    } else {
      var lbl = (state.idx < total-1) ? "পরবর্তী প্রশ্ন" : "ফলাফল দেখুন";
      html += '<button class="btn" id="nextBtn">'+lbl+'</button>';
    }
    html += '</div>';

    root.innerHTML = html;
    byId("homeBtn").addEventListener("click", goHome);

    if(!item.answered){
      root.querySelectorAll(".opt").forEach(function(el){
        el.addEventListener("click", function(){ pickOption(el); });
      });
    }
    var nb = byId("nextBtn");
    if(nb) nb.addEventListener("click", nextQuestion);
    var sb = byId("skipBtn");
    if(sb) sb.addEventListener("click", nextQuestion);
  }

  function pickOption(el){
    var item = currentItem();
    if(item.answered) return;
    var origIdx = parseInt(el.getAttribute("data-orig"),10);
    item.answered = true;
    item.picked = origIdx;
    var q = item.q;
    var isCorrect = (origIdx === q.answerIndex);

    store.attempted++;
    if(isCorrect){
      state.score++;
      store.correct++;
      var wi = store.wrongIds.indexOf(q.id);
      if(wi !== -1) store.wrongIds.splice(wi,1);
    } else {
      if(store.wrongIds.indexOf(q.id) === -1) store.wrongIds.push(q.id);
    }
    saveStore(store);

    if(state.mode === "timed"){
      nextQuestion();
    } else {
      renderQuiz();
    }
  }

  function nextQuestion(){
    if(state.idx < state.items.length-1){
      state.idx++;
      renderQuiz();
    } else {
      finishSession();
    }
  }

  function finishSession(){
    clearTimer();
    var total = state.items.length;
    var pct = total ? Math.round(100*state.score/total) : 0;
    if(state.subjectKey !== "__review__" && state.mode !== "timed"){
      var prevBest = store.best[state.subjectKey];
      if(prevBest === undefined || pct > prevBest){
        store.best[state.subjectKey] = pct;
      }
    }
    saveStore(store);
    renderResult(pct, total);
  }

  function renderResult(pct, total){
    var attemptedItems = state.items.filter(function(it){ return it.picked !== null; });
    var wrongItems = attemptedItems.filter(function(it){ return it.picked !== it.q.answerIndex; });
    var skipped = state.items.length - attemptedItems.length;

    var html = "";
    html += '<div class="result-hero">';
    html += '<div class="cap">'+state.label+' · '+(state.mode==="timed"?"সময় শেষ / সেশন সম্পন্ন":"অনুশীলন শেষ")+'</div>';
    html += '<div class="big">'+state.score+' / '+total+'</div>';
    html += '<div class="cap">সঠিক উত্তর '+pct+'%'+(skipped>0?' · এড়িয়ে গেছেন '+skipped+'টি':'')+'</div>';
    html += '</div>';
    html += '<div class="content">';

    html += '<div class="btn-col">';
    if(state.mode === "timed"){
      html += '<button class="btn" id="retrySame">আবার টাইম গেম খেলুন</button>';
    } else {
      html += '<button class="btn" id="retrySame">আবার একই বিষয় অনুশীলন করুন</button>';
    }
    html += '<button class="btn secondary" id="goHomeBtn">হোমে ফিরুন</button>';
    html += '</div>';

    html += '<div class="section-label">ভুল হওয়া প্রশ্নগুলো</div>';
    if(wrongItems.length === 0){
      html += '<div class="empty-note">অভিনন্দন! এই সেশনে কোনো ভুল হয়নি।</div>';
    } else {
      html += '<div class="review-list">';
      wrongItems.forEach(function(it){
        var q = it.q;
        html += '<div class="review-item">';
        html += '<div class="rq">'+escapeHtml(q.q)+'</div>';
        html += '<div class="ra wrong">আপনার উত্তর: '+escapeHtml(q.options[it.picked])+'</div>';
        html += '<div class="ra correct">সঠিক উত্তর: '+escapeHtml(q.options[q.answerIndex])+'</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    root.innerHTML = html;

    var lastSubject = state.subjectKey, lastLabel = state.label, lastMode = state.mode, lastDur = state.timeLimitSec;
    byId("retrySame").addEventListener("click", function(){
      if(lastMode === "timed"){
        startSession(lastSubject, lastLabel, {timed:true, durationMin:Math.round(lastDur/60)});
      } else {
        startSession(lastSubject, lastLabel);
      }
    });
    byId("goHomeBtn").addEventListener("click", goHome);
  }

  // ---------------- Progress screen ----------------
  function renderProgress(){
    var html = "";
    html += '<div class="topbar"><span class="home-tap" id="homeBtn"><span class="ico">⌂</span> হোম</span><span></span></div>';
    html += '<div class="content">';
    html += '<h2 style="margin:4px 0 14px;">আমার অগ্রগতি</h2>';

    html += '<div class="stat-row" style="margin-bottom:20px;">';
    html += '<div class="stat-box"><div class="num">'+store.attempted+'</div><div class="lbl">মোট চেষ্টা</div></div>';
    var overallPct = store.attempted ? Math.round(100*store.correct/store.attempted) : 0;
    html += '<div class="stat-box"><div class="num">'+overallPct+'%</div><div class="lbl">সার্বিক সঠিক হার</div></div>';
    html += '<div class="stat-box"><div class="num">'+store.timedRuns+'</div><div class="lbl">টাইম গেম খেলেছেন</div></div>';
    html += '</div>';

    html += '<div class="section-label">বিষয়ভিত্তিক সেরা স্কোর</div>';
    var any = false;
    SUBJECTS.forEach(function(s){
      var best = store.best[s.key];
      if(best === undefined) return;
      any = true;
      var color = best>=75 ? "var(--correct)" : (best>=45 ? "var(--gold)" : "var(--wrong)");
      html += '<div class="prog-item">';
      html += '<div class="prow"><span class="pname">'+s.name+'</span><span class="ppct">'+best+'%</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:'+best+'%;background:'+color+';"></div></div>';
      html += '<div class="psub">'+countFor(s.key)+'টি প্রশ্নের মধ্যে অনুশীলন করা হয়েছে</div>';
      html += '</div>';
    });
    if(!any){
      html += '<div class="empty-note">এখনো কোনো বিষয়ে অনুশীলন সম্পন্ন করেননি। প্র্যাকটিস মোড দিয়ে শুরু করুন।</div>';
    }

    html += '<div class="section-label">ভুল প্রশ্ন ব্যাংক</div>';
    html += '<div class="prog-item" style="margin-bottom:0;">';
    html += '<div class="prow"><span class="pname">জমে থাকা ভুল প্রশ্ন</span><span class="ppct" style="color:var(--maroon);">'+store.wrongIds.length+' টি</span></div>';
    html += '<div class="psub">হোম থেকে "ভুল প্রশ্ন রিভিউ" মোডে গিয়ে এগুলো আবার অনুশীলন করুন</div>';
    html += '</div>';

    html += '</div>';
    root.innerHTML = html;
    byId("homeBtn").addEventListener("click", goHome);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // map answer letter (A/B/C/D) to index 0-3, precompute once
  var LETTER_TO_IDX = {A:0,B:1,C:2,D:3};
  QUESTIONS.forEach(function(q){
    q.answerIndex = LETTER_TO_IDX[q.answer];
  });

  // ---------------- Gate screen (name + mobile, one-time) ----------------
  function renderGate(){
    var html = "";
    html += '<div class="gate-wrap"><div class="gate-card">';
    html += '<h2 class="serif">স্বাগতম 🙏</h2>';
    html += '<div class="gate-sub">শুরু করার আগে আপনার নাম ও মোবাইল নম্বরটি দিন। এটা একবারই জিজ্ঞেস করা হবে।</div>';
    html += '<div class="field-label">আপনার নাম</div>';
    html += '<input class="field-input" id="gateName" type="text" placeholder="যেমনঃ নাহিদ ইসলাম">';
    html += '<div class="field-error" id="nameErr">নাম দিন</div>';
    html += '<div class="field-label">মোবাইল নম্বর</div>';
    html += '<input class="field-input" id="gateMobile" type="tel" placeholder="যেমনঃ 01XXXXXXXXX">';
    html += '<div class="field-error" id="mobileErr">সঠিক মোবাইল নম্বর দিন</div>';
    html += '<button class="btn" id="gateSubmit">শুরু করুন</button>';
    html += '</div></div>';
    root.innerHTML = html;

    byId("gateSubmit").addEventListener("click", function(){
      var name = byId("gateName").value.trim();
      var mobile = sanitizeMobile(byId("gateMobile").value);
      var ok = true;
      if(name.length < 2){ byId("nameErr").classList.add("show"); ok = false; } else { byId("nameErr").classList.remove("show"); }
      if(mobile.length < 10){ byId("mobileErr").classList.add("show"); ok = false; } else { byId("mobileErr").classList.remove("show"); }
      if(!ok) return;
      var u = {name:name, mobile:mobile};
      saveUser(u);
      currentUser = u;
      registerUserCloud(u);
      renderHome();
    });
  }

  function boot(){
    currentUser = loadUser();
    if(!currentUser){
      renderGate();
    } else {
      registerUserCloud(currentUser);
      renderHome();
    }
  }

  boot();
})();
</script>
</body>
</html>
